<style>
/* =========================================================
   Base — pas de variables CSS (non supportées sur vieux Android)
   ========================================================= */
* { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
html { font-size: 16px; }
body {
  background-color: #000;
  background-image:
    -webkit-radial-gradient(15% 0%, ellipse, rgba(10,132,255,0.16) 0%, rgba(10,132,255,0) 45%),
    -webkit-radial-gradient(90% 100%, ellipse, rgba(94,92,230,0.12) 0%, rgba(94,92,230,0) 50%),
    -webkit-linear-gradient(top, #0b0b0f 0%, #000 100%);
  background-image:
    radial-gradient(ellipse at 15% 0%, rgba(10,132,255,0.16) 0%, rgba(10,132,255,0) 45%),
    radial-gradient(ellipse at 90% 100%, rgba(94,92,230,0.12) 0%, rgba(94,92,230,0) 50%),
    linear-gradient(to bottom, #0b0b0f 0%, #000 100%);
  color: #fff;
  font-family: "Inter", -apple-system, "SF Pro Display", "Helvetica Neue", "Roboto", "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%;
}
button { font-family: inherit; color: inherit; background: none; border: 0; outline: none; cursor: pointer; }
input { font-family: inherit; -webkit-user-select: text; user-select: text; }
svg { display: block; }
.num { -webkit-font-feature-settings: "tnum" 1; font-feature-settings: "tnum" 1; }

/* =========================================================
   Grille : 3 colonnes x 2 lignes (flexbox, marges au lieu de gap)
   ========================================================= */
#app {
  height: 100%;
  padding: 1.25rem;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
}
.row {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  min-height: 0;
  display: -webkit-box; display: -webkit-flex; display: flex;
}
.row + .row { margin-top: 1rem; }

.card {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  min-width: 0; min-height: 0;
  position: relative;
  overflow: hidden;
  padding: 1.375rem 1.5rem;
  border-radius: 1.75rem;
  background-color: rgba(28,28,32,0.82);   /* repli sans flou */
  border: 1px solid rgba(255,255,255,0.07);
  -webkit-box-shadow: 0 0.75rem 2.5rem rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  box-shadow: 0 0.75rem 2.5rem rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
}
.card + .card { margin-left: 1rem; }
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .card {
    background-color: rgba(44,44,50,0.42);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    backdrop-filter: blur(30px) saturate(160%);
  }
}

/* En-tête de carte */
.head {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  min-height: 2.5rem;
  margin-top: -0.375rem;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.head .label {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  font-size: 0.875rem; font-weight: 600; letter-spacing: 0.01em;
  color: rgba(235,235,245,0.6);
  white-space: nowrap; overflow: hidden;
}
.head .label svg { width: 1rem; height: 1rem; margin-right: 0.4rem; -webkit-flex-shrink: 0; flex-shrink: 0; }
.head .side { font-size: 0.8125rem; color: rgba(235,235,245,0.38); font-weight: 500; }

/* Boutons ronds (zones tactiles >= 44px) */
.icon-btn {
  width: 2.75rem; height: 2.75rem;
  margin-right: -0.625rem;
  border-radius: 50%;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  color: rgba(235,235,245,0.45);
  -webkit-flex-shrink: 0; flex-shrink: 0;
  -webkit-transition: background-color .2s, color .2s; transition: background-color .2s, color .2s;
}
.icon-btn:active { background-color: rgba(255,255,255,0.08); }
.icon-btn svg { width: 1.375rem; height: 1.375rem; }
.icon-btn.accent span {
  width: 2rem; height: 2rem; border-radius: 50%;
  background-color: #0A84FF; color: #fff;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
}
.icon-btn.accent svg { width: 1.125rem; height: 1.125rem; }
.icon-btn.accent:active { background: none; }
.icon-btn.accent:active span { background-color: #0068d6; }

.foot {
  -webkit-flex-shrink: 0; flex-shrink: 0;
  font-size: 0.75rem; color: rgba(235,235,245,0.32); font-weight: 500;
  margin-top: 0.5rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.grow { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-height: 0; }
.muted { color: rgba(235,235,245,0.6); }
.faint { color: rgba(235,235,245,0.38); }
.up { color: #30D158; }
.down { color: #FF453A; }

/* Fondu doux quand une valeur change */
@-webkit-keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.fade { -webkit-animation: fadeIn .7s ease; animation: fadeIn .7s ease; }

/* =========================================================
   1. Heure
   ========================================================= */
#clock-card .center {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  padding-bottom: 1.5rem;
}
#time {
  font-size: 5.5rem; font-weight: 200; line-height: 1;
  letter-spacing: -0.03em; margin-left: -0.3rem;
  white-space: nowrap;
}
#date {
  margin-top: 0.875rem;
  font-size: 1.25rem; font-weight: 400; color: rgba(235,235,245,0.6);
}
#date:first-letter { text-transform: uppercase; }

/* =========================================================
   2. Météo
   ========================================================= */
.wx-main {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  margin-top: 0.25rem;
}
#wx-temp { font-size: 4rem; font-weight: 200; line-height: 1; letter-spacing: -0.03em; }
#wx-icon { width: 3.25rem; height: 3.25rem; margin-left: auto; color: #fff; }
#wx-icon svg { width: 100%; height: 100%; }
#wx-desc { margin-top: 0.5rem; font-size: 0.9375rem; font-weight: 500; }
#wx-sub { margin-top: 0.2rem; font-size: 0.875rem; color: rgba(235,235,245,0.6); }
.wx-days {
  margin-top: auto;
  display: -webkit-box; display: -webkit-flex; display: flex;
  border-top: 1px solid rgba(255,255,255,0.07);
  padding-top: 0.75rem;
}
.wx-day {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
}
.wx-day .d { font-size: 0.8125rem; color: rgba(235,235,245,0.6); font-weight: 500; }
.wx-day .i { width: 1.625rem; height: 1.625rem; margin: 0.35rem 0; }
.wx-day .i svg { width: 100%; height: 100%; }
.wx-day .t { font-size: 0.875rem; }
.wx-day .t span { color: rgba(235,235,245,0.38); }

/* =========================================================
   3 & 4. Listes (to-do / études)
   ========================================================= */
.list {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  margin: 0 -0.5rem 0 -0.5rem;
  padding: 0 0.5rem;
}
.item {
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  min-height: 3rem;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.item:last-child { border-bottom: 0; }
.item .txt {
  -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0;
  font-size: 1rem; line-height: 1.3;
  padding: 0.5rem 0;
  word-wrap: break-word;
}
.item .txt small { display: block; font-size: 0.75rem; color: rgba(235,235,245,0.38); margin-top: 0.1rem; }
.check {
  width: 2.75rem; height: 2.75rem; margin-left: -0.6rem;
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  -webkit-flex-shrink: 0; flex-shrink: 0;
}
.check span {
  width: 1.375rem; height: 1.375rem; border-radius: 50%;
  border: 1.5px solid rgba(235,235,245,0.35);
  display: -webkit-box; display: -webkit-flex; display: flex;
  -webkit-box-align: center; -webkit-align-items: center; align-items: center;
  -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
  -webkit-transition: all .25s; transition: all .25s;
}

  function decodeEntities(str) {

    var t = Date.parse(str);

    var items = [], doc, nodes, i;
    try { doc = new DOMParser().parseFromString(text, 'text/xml'); } catch (e) { return items; }
    nodes = doc.getElementsByTagName('item');
    for (i = 0; i < nodes.length; i++) {
      var tn = nodes[i].getElementsByTagName('title')[0];
      var dn = nodes[i].getElementsByTagName('pubDate')[0];
      if (!tn) continue;
      items.push({ t: decodeEntities(tn.textContent), d: dn ? (Date.parse(dn.textContent) || 0) : 0 });

  function getText(url, ok, fail) {

    xhr.onreadystatechange = function () {

  var PEA = {

  function parseYahoo(d) {
    try {
      var r = d.chart.result[0], m = r.meta;
      var ts = r.timestamp || [], cl = r.indicators.quote[0].close || [];
      var closes = [], i;
      for (i = 0; i < ts.length; i++) {
        if (typeof cl[i] === 'number') closes.push([toISO(new Date(ts[i] * 1000)), cl[i]]);
      }
      var price = typeof m.regularMarketPrice === 'number' ? m.regularMarketPrice : closes[closes.length - 1][1];
      var day = toISO(new Date((m.regularMarketTime || ts[ts.length - 1]) * 1000));
      // Clôture de la séance précédente
      var prev = null;
      for (i = closes.length - 1; i >= 0; i--) { if (closes[i][0] < day) { prev = closes[i][1]; break; } }
      if (prev === null) prev = m.chartPreviousClose || price;
      if (closes.length && closes[closes.length - 1][0] === day) closes[closes.length - 1][1] = price;
      else closes.push([day, price]);
      if (!(price > 0)) return null;
      return { price: price, prev: prev, day: day, closes: closes, ts: Date.now() };
    } catch (e) { return null; }
  }

  function fetchQuote(ticker, done) {
    var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?range=1mo&interval=1d';
    var idx = goodSource, tries = 0;
    function next() {
      tries++;
      if (tries >= SOURCES.length) { done(null); return; }
      idx = (idx + 1) % SOURCES.length;
      attempt();
    }
    function attempt() {
      getJSON(SOURCES[idx](url), function (d) {
        var q = parseYahoo(d);
        if (!q) { next(); return; }
        if (idx !== goodSource) { goodSource = idx; save('peaSource', idx); }
        done(q);
      }, next);
    }
    attempt();
  }

  function fetchPea() {
    if (peaBusy) return;
    peaBusy = true; peaLastTry = Date.now();
    var left = PEA.lignes.length, failed = 0, i;
    function one(ticker) {
      fetchQuote(ticker, function (q) {
        if (q) quotes[ticker] = q; else failed++;
        left--;
        if (left === 0) {
          peaBusy = false;
          peaOffline = failed > 0;
          save('peaQuotes', quotes);
          renderPea();
        }
      });
    }
    for (i = 0; i < PEA.lignes.length; i++) one(PEA.lignes[i].ticker);
  }

  // Bourse de Paris : du lundi au vendredi, 9 h - 17 h 35
  function marketOpen() {

  }

  function fmtMoney(v, dec, sign) {
    var neg = v < 0, a = Math.abs(v);
    var f = dec ? a.toFixed(dec) : Math.round(a).toString();
    var parts = f.split('.'), s = parts[0], out = '';
    while (s.length > 3) { out = ' ' + s.slice(-3) + out; s = s.slice(0, -3); }
    s = s + out + (parts[1] ? ',' + parts[1] : '');
    return (neg ? '−' : (sign ? '+' : '')) + s + ' €';
  }
  function fmtPct(v) {
    return (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2).replace('.', ',') + ' %';
  }
  var UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>';
  var DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5.5 12.5L12 19l6.5-6.5"/></svg>';

  function renderPea() {
    var total = PEA.especes, prevTotal = PEA.especes, cost = 0, have = 0, oldest = 0, day = '';
    var rows = '', i, l, q, val;
    for (i = 0; i < PEA.lignes.length; i++) {

        total += val; prevTotal += l.quantite * q.prev; have++;

      } else {

      (up ? UP : DOWN) + fmtPct(dp) + '&nbsp;&nbsp;' + fmtMoney(dd, 2, true) + '</span><span class="faint">' + when + '</span>');

    var lat = (total - PEA.especes) - cost, lp = cost ? lat / cost * 100 : 0;

      fmtMoney(lat, 2, true) + '&nbsp;&nbsp;' + fmtPct(lp) + '</span>');

  // Valeur du PEA jour par jour sur 1 mois (avec les quantités actuelles)
  function buildChart() {
    var dates = {}, list = [], i, j, l, q;
    for (i = 0; i < PEA.lignes.length; i++) {
      q = quotes[PEA.lignes[i].ticker];
      if (!q) continue;
      for (j = 0; j < q.closes.length; j++) dates[q.closes[j][0]] = 1;
    }
    for (var k in dates) if (dates.hasOwnProperty(k)) list.push(k);
    list.sort();
    var pts = [];
    for (i = 0; i < list.length; i++) {
      var sum = PEA.especes;
      for (j = 0; j < PEA.lignes.length; j++) {
        l = PEA.lignes[j]; q = quotes[l.ticker];
        var c = l.prixMoyen;
        if (q) {
          c = q.closes[0][1];
          for (var m = 0; m < q.closes.length && q.closes[m][0] <= list[i]; m++) c = q.closes[m][1];
        }
        sum += l.quantite * c;
      }
      pts.push(sum);
    }
    chart = { pts: pts };
  }

  function drawSpark() {
    var cv = $('pea-canvas');
    if (!cv || !cv.getContext) return;
    var box = cv.parentNode;
    var w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    var r = window.devicePixelRatio || 1;
    cv.width = Math.round(w * r); cv.height = Math.round(h * r);
    var ctx = cv.getContext('2d');
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!chart || !chart.pts || chart.pts.length < 2) return;

    var p = chart.pts, n = p.length, min = p[0], max = p[0], i;
    for (i = 1; i < n; i++) { if (p[i] < min) min = p[i]; if (p[i] > max) max = p[i]; }
    var span = (max - min) || 1, padT = 6, padB = 6, lw = Math.max(1.5, w / 160);
    function X(i) { return lw + (w - 2 * lw) * i / (n - 1); }
    function Y(v) { return padT + (h - padT - padB) * (1 - (v - min) / span); }
    var up = p[n - 1] >= p[0];
    var col = up ? '48,209,88' : '255,69,58';

    // Ligne de référence (prix d'il y a 7 jours)
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    if (ctx.setLineDash) ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.moveTo(0, Math.round(Y(p[0])) + 0.5); ctx.lineTo(w, Math.round(Y(p[0])) + 0.5); ctx.stroke();
    if (ctx.setLineDash) ctx.setLineDash([]);

    // Aire dégradée
    ctx.beginPath();
    ctx.moveTo(X(0), Y(p[0]));
    for (i = 1; i < n; i++) ctx.lineTo(X(i), Y(p[i]));
    ctx.lineTo(X(n - 1), h); ctx.lineTo(X(0), h); ctx.closePath();
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(' + col + ',0.22)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g; ctx.fill();

    // Courbe
    ctx.beginPath();
    ctx.moveTo(X(0), Y(p[0]));
    for (i = 1; i < n; i++) ctx.lineTo(X(i), Y(p[i]));
    ctx.strokeStyle = 'rgb(' + col + ')';
    ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke();

    // Point final
    ctx.beginPath();
    ctx.arc(X(n - 1), Y(p[n - 1]), lw * 1.8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgb(' + col + ')'; ctx.fill();
  }

    } else if (n === 0) {
      setHTML($('trip-days'), 'Jour J');
      setHTML($('trip-unit'), 'Bon voyage');
    } else {
      setHTML($('trip-days'), '' + (-n));
      setHTML($('trip-unit'), -n === 1 ? 'jour depuis le départ' : 'jours depuis le départ');
    }
    setHTML($('trip-date'), 'Départ le ' + longDate(d));
  }
  $('trip-set').addEventListener('click', function () {
    openModal({
      title: 'Date du départ', date: true, noText: true, l2: 'Date', v2: toISO(tripDate()), ok: 'Enregistrer',
      submit: function (txt, dateStr) {
        var d = parseUserDate(dateStr);
        if (!d) return 'Choisis une date (format JJ/MM/AAAA).';
        save('trip', toISO(d));
        renderTrip();
        return null;
      }
    });
  });

  /* ======================================================
     Fenêtre modale (ajout / réglage)
     ====================================================== */
  var modalOpts = null;
  var dateSupported = (function () {
    var i = document.createElement('input');
    try { i.setAttribute('type', 'date'); } catch (e) { return false; }
    return i.type === 'date';
  })();
  function openModal(o) {
    modalOpts = o;
    $('m-title').innerHTML = esc(o.title);
    $('m-ok').innerHTML = esc(o.ok);
    $('m-hint').innerHTML = (o.date && !dateSupported) ? 'Format : JJ/MM/AAAA' : '';
    $('m-hint').className = 'hint';
    $('m-f1').style.display = o.noText ? 'none' : 'block';
    $('m-f2').style.display = o.date ? 'block' : 'none';
    $('m-l1').innerHTML = esc(o.l1 || '');
    $('m-l2').innerHTML = esc(o.l2 || '');
    $('m-i1').value = '';
    $('m-i1').setAttribute('placeholder', o.p1 || '');
    var i2 = $('m-i2');
    if (!dateSupported) i2.setAttribute('placeholder', 'JJ/MM/AAAA');
    if (o.v2) {
      var d = parseISODate(o.v2);
      i2.value = dateSupported ? o.v2 : (pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear());
    } else { i2.value = ''; }
    $('modal').className = 'open';
    setTimeout(function () { try { (o.noText ? i2 : $('m-i1')).focus(); } catch (e) {} }, 150);
  }
  function closeModal() {
    $('modal').className = '';
    modalOpts = null;
    try { document.activeElement.blur(); } catch (e) {}
    setTimeout(function () { rescale(true); }, 400);
  }
  function submitModal() {
    if (!modalOpts) return;
    var err = modalOpts.submit($('m-i1').value, $('m-i2').value);
    if (err) { $('m-hint').innerHTML = esc(err); $('m-hint').className = 'hint err'; return; }
    closeModal();
  }
  $('m-ok').addEventListener('click', submitModal);
  $('m-cancel').addEventListener('click', closeModal);
  $('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
  function onEnter(e) { if (e.keyCode === 13) { e.preventDefault(); submitModal(); } }
  $('m-i1').addEventListener('keydown', onEnter);
  $('m-i2').addEventListener('keydown', onEnter);

  /* ======================================================
     Mode nuit
     ====================================================== */
  function setNight(on) {
    $('night').className = on ? 'on' : '';
    save('night', !!on);
    if (on) { lastMinute = -1; tick(); }
  }
  $('night-btn').addEventListener('click', function (e) { e.stopPropagation(); setNight(true); });
  $('night').addEventListener('click', function () { setNight(false); });
  // Petit déplacement de l'heure toutes les 10 min pour protéger l'écran
  function nightShift(now) {
    var k = Math.floor((now.getHours() * 60 + now.getMinutes()) / 10) % 6;
    var dx = [0, -3, 3, -2, 2, 0][k], dy = [0, -2, 2, 3, -3, 1][k];
    var t = 'translate(' + dx + 'rem,' + dy + 'rem)';
    var el = $('night-time');
    el.style.webkitTransform = t; el.style.transform = t;
  }

  /* ======================================================
     Rechargement automatique une fois par nuit (vers 3 h 30)
     On vérifie d'abord qu'internet marche, sinon on garde la page.
     ====================================================== */
  function maybeNightlyReload(now) {
    if (now.getHours() !== RELOAD_HOUR || now.getMinutes() < RELOAD_MIN) return;
    var today = toISO(now);
    if (load('reloadDay', '') === today) return;
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 400) {
        save('reloadDay', today);
        window.location.reload(true);
      }
    };
    try {
      xhr.open('GET', window.location.pathname + '?check=' + Date.now(), true);
      xhr.send();
    } catch (e) {}
  }

  /* ======================================================
     Garder l'écran allumé (navigateurs récents seulement)
     ====================================================== */
  function keepAwake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(null, function () {});
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { keepAwake(); refreshIfStale(); }
  });
  window.addEventListener('online', function () { fetchWeather(); fetchPea(); fetchNews(); });

  function refreshIfStale() {
    var now = Date.now();
    if (!wx || now - wx.ts > WX_EVERY) fetchWeather();
    peaTick();
    if (!news || now - news.ts > NEWS_EVERY) fetchNews();
  }

  /* ======================================================
     Démarrage
     ====================================================== */
  rescale(true);
  renderTodos();
  renderNews();
  renderTrip();
  renderWeather();
  renderPea();
  tick();
  if (load('night', false)) setNight(true);

  fetchWeather();
  fetchPea();
  fetchNews();
  setInterval(tick, 1000);
  setInterval(fetchNews, NEWS_EVERY);
  setInterval(fetchWeather, WX_EVERY);
  setInterval(peaTick, 60 * 1000);
  keepAwake();
  document.addEventListener('click', keepAwake);

  /* ======================================================
     Plein écran au premier toucher (secours si la barre du
     navigateur est visible). Rien ne se passe si on y est déjà.
     ====================================================== */
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
      (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches));
  }
  document.addEventListener('click', function (e) {
    if (isFullscreen() || modalOpts) return;
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (!req) return;
    try {
      var r = req.call(el);
      if (r && r.then) r.then(null, function () {});
    } catch (err) {}
    setTimeout(function () { rescale(true); }, 500);
  }, true);

  // Redessine la courbe une fois la police chargée (tailles définitives)
  setTimeout(function () { rescale(true); }, 1500);
})();
</script>
</body>
</html>
